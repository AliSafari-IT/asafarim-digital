name: edumatch
version: 1.0.0+1
publish_to: 'none'

description: EduMatch mobile app for students and tutors

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  
  # HTTP Client
  dio: ^5.4.0
  dio_smart_retry: ^7.0.1
  
  # Storage
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Forms & Input
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  
  # Media
  image_picker: ^1.0.7
  record: ^6.2.0
  permission_handler: ^12.0.1
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^14.0.2
  
  # Payments
  flutter_stripe: ^12.6.0
  
  # Notifications
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  
  # Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  
  # Utilities
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  intl: ^0.20.0
  url_launcher: ^6.2.2
  share_plus: ^12.0.2
  path_provider: ^2.1.1
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.7
  google_sign_in_web: ^1.1.3

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/fonts/

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

dependency_overrides:
  # Ensure compatibility
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0