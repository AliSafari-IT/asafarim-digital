name: "Discord Notify"

# Sprint 3B-2t — User reported "github commits Discord'a gelmedi" (commit
# notifications not reaching Discord). Posts a compact message to the Pi
# uptime Discord webhook on every push to main + on Deploy-to-Production
# workflow completion (success/failure).
#
# Webhook URL is stored as a GitHub Actions repo secret (DISCORD_WEBHOOK_URL)
# rather than hardcoded so it can be rotated without committing it.

on:
  push:
    branches: ['*']
  workflow_run:
    workflows: ["Transition Performance Tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Post commit summary to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Pass commit fields through env so apostrophes/quotes in the
          # message body never break the shell. Inline ${{ ... }} into a
          # bash single-quote string is unsafe — Turkish text like
          # "Discord'a gelmedi" terminated the quote and ran `on` as a
          # command (exit 127 in the first deploy attempt).
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret not set; skipping notification."
            exit 0
          fi
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-200)
          SHA_SHORT=${COMMIT_SHA:0:7}
          PAYLOAD=$(jq -nc \
            --arg author "$AUTHOR_NAME" \
            --arg subject "$SUBJECT" \
            --arg sha "$SHA_SHORT" \
            --arg url "$COMMIT_URL" \
            --arg branch "$BRANCH_NAME" \
            '{content: ("📦 **Commit** on `" + $branch + "` by " + $author + " — `" + $sha + "` " + $subject + "\n" + $url)}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          echo "Discord push notification sent for $SHA_SHORT"

  notify-deploy:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy outcome to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_NAME: ${{ github.event.workflow_run.name }}
          DEPLOY_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret not set; skipping notification."
            exit 0
          fi
          ICON="🚀"
          if [ "$DEPLOY_CONCLUSION" != "success" ]; then ICON="❌"; fi
          SHA_SHORT=${HEAD_SHA:0:7}
          PAYLOAD=$(jq -nc \
            --arg icon "$ICON" \
            --arg name "$DEPLOY_NAME" \
            --arg conclusion "$DEPLOY_CONCLUSION" \
            --arg sha "$SHA_SHORT" \
            --arg url "$DEPLOY_URL" \
            '{content: ($icon + " **" + $name + "** — `" + $sha + "` " + $conclusion + "\n" + $url)}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          echo "Discord deploy notification sent for $SHA_SHORT ($DEPLOY_CONCLUSION)"
