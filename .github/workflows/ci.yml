name: CI — Type Check, Lint, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: "true"

jobs:
  # ───────────────────────────────────────────
  # 1. Type Check
  # ───────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @asafarim/db db:generate

      - name: Type Check all packages
        run: pnpm typecheck
        continue-on-error: false

  # ───────────────────────────────────────────
  # 2. Lint
  # ───────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @asafarim/db db:generate

      - name: Lint all packages
        run: pnpm lint
        continue-on-error: false

  # ───────────────────────────────────────────
  # 3. Build Verification
  # ───────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @asafarim/db db:generate

      - name: Build shared packages
        run: |
          pnpm --filter @asafarim/db build
          pnpm --filter @asafarim/auth build
          pnpm --filter @asafarim/ui build
          pnpm --filter @asafarim/payments build

      - name: Build Portal (App)
        run: pnpm --filter portal build
        env:
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3000
          NEXT_PUBLIC_EDUMATCH_URL: http://localhost:3005
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build EduMatch (App)
        run: pnpm --filter edumatch build
        env:
          NEXT_PUBLIC_EDUMATCH_URL: http://localhost:3005
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3000

      - name: Build Vionto (App)
        run: pnpm --filter vionto build
        env:
          NEXT_PUBLIC_VIONTO_URL: http://localhost:3006
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3000

  # ───────────────────────────────────────────
  # 4. Vionto Docker Config & Dockerfile Lint
  # ───────────────────────────────────────────
  vionto-docker-check:
    name: Vionto Docker Config & Dockerfile Lint
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Lint Vionto web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/vionto/Dockerfile
          failure-threshold: error

      - name: Lint Vionto worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/docker/Dockerfile.vionto-worker
          failure-threshold: error

  # ───────────────────────────────────────────
  # 5. Vionto Required Secrets Audit
  # ───────────────────────────────────────────
  secrets-check:
    name: Vionto Required Secrets Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Audit Vionto production secrets
        run: |
          MISSING=()
          [ -z "$S_DO_SPACES_KEY" ]       && MISSING+=("DO_SPACES_KEY")
          [ -z "$S_DO_SPACES_SECRET" ]    && MISSING+=("DO_SPACES_SECRET")
          [ -z "$S_DO_SPACES_BUCKET" ]    && MISSING+=("DO_SPACES_BUCKET")
          [ -z "$S_DO_SPACES_REGION" ]    && MISSING+=("DO_SPACES_REGION")
          [ -z "$S_REDIS_URL" ]           && MISSING+=("REDIS_URL")
          [ -z "$S_OPENAI_API_KEY" ]      && MISSING+=("OPENAI_API_KEY")
          [ -z "$S_ELEVENLABS_API_KEY" ]  && MISSING+=("ELEVENLABS_API_KEY")
          [ -z "$S_VIONTO_URL" ]          && MISSING+=("NEXT_PUBLIC_VIONTO_URL")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::warning title=Missing Vionto Secrets::Required secrets not configured: ${MISSING[*]}"
            echo "Set these in Settings → Secrets & Variables → Actions before deploying Vionto to production."
          else
            echo "✓ All required Vionto secrets are configured."
          fi
        env:
          S_DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          S_DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
          S_DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          S_DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          S_REDIS_URL: ${{ secrets.REDIS_URL }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S_ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          S_VIONTO_URL: ${{ secrets.NEXT_PUBLIC_VIONTO_URL }}

  # ───────────────────────────────────────────
  # 7. Test (if tests exist)
  # ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @asafarim/db db:generate

      - name: Run tests
        run: pnpm test --if-present || echo "No tests configured"

  # ───────────────────────────────────────────
  # 8. Database Schema Validation
  # ───────────────────────────────────────────
  schema-check:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter @asafarim/db prisma validate

      - name: Check for uncommitted migrations
        run: |
          cd packages/db
          if [ -d prisma/migrations ]; then
            echo "✓ Migrations directory exists"
            ls -la prisma/migrations/
          else
            echo "⚠ No migrations directory found - schema changes may need migration"
          fi
