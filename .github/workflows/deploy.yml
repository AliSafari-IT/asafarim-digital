name: Deploy ASafariM-Digital to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_seed:
        description: "Re-run DB seed even if SiteContent is already populated"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
  DEPLOY_PATH: /var/repos/asafarim-digital
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Keep production deploys serialized, but do not cancel a running deploy
# after it has already mutated the server state. Queue the next run instead
# so Actions does not report a false-negative "cancelled" deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}"    || (echo "VPS_HOST is not set"    && exit 1)
          test -n "${{ secrets.VPS_USER }}"    || (echo "VPS_USER is not set"    && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "VPS_SSH_KEY is not set" && exit 1)
          test -n "${{ secrets.DO_SPACES_KEY }}"      || echo "::warning::DO_SPACES_KEY not set — Vionto storage uploads will fail"
          test -n "${{ secrets.DO_SPACES_SECRET }}"   || echo "::warning::DO_SPACES_SECRET not set — Vionto storage uploads will fail"
          test -n "${{ secrets.REDIS_URL }}"          || echo "::warning::REDIS_URL not set — Vionto job queue will not function"
          test -n "${{ secrets.OPENAI_API_KEY }}"     || echo "::warning::OPENAI_API_KEY not set — Vionto AI generation will not function"
          test -n "${{ secrets.ELEVENLABS_API_KEY }}" || echo "::warning::ELEVENLABS_API_KEY not set — Vionto TTS will not function"

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -4 -T 15 -p "${VPS_SSH_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        env:
          FORCE_SEED: ${{ github.event.inputs.force_seed || 'false' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-4 -p ${VPS_SSH_PORT} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"

          echo "Checking SSH connectivity to VPS on ${VPS_HOST}:${VPS_SSH_PORT}..."
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${VPS_SSH_PORT}" 2>/dev/null; then
            echo "TCP connectivity to ${VPS_HOST}:${VPS_SSH_PORT} is open."
          else
            echo "::warning::TCP connectivity to ${VPS_HOST}:${VPS_SSH_PORT} failed. If SSH is on a non-standard port, set the VPS_SSH_PORT secret. Otherwise check VPS firewall/provider rules/sshd."
          fi

          SSH_READY=false
          for attempt in 1 2 3; do
            if ssh -v ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" "echo ssh-ok"; then
              SSH_READY=true
              echo "SSH connectivity confirmed on attempt ${attempt}."
              break
            fi
            echo "SSH preflight failed (attempt ${attempt}/3). Retrying in 10s..."
            sleep 10
          done

          if [ "$SSH_READY" != "true" ]; then
            echo "Unable to reach VPS over SSH after 3 attempts at ${VPS_HOST}:${VPS_SSH_PORT}."
            echo "Check VPS status, provider firewall/security-group inbound TCP ${VPS_SSH_PORT}, UFW/fail2ban, sshd status, and that VPS_HOST points to the current public IP."
            exit 1
          fi

          # Sync files to VPS
          RSYNC_DONE=false
          for attempt in 1 2 3; do
            if rsync -e "ssh ${SSH_OPTS}" -avz --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='.turbo' \
              --exclude='docker-compose.override.yml' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='*/.env' \
              --exclude='*/.env.*' \
              --exclude='apps/*/.env' \
              --exclude='apps/*/.env.*' \
              --filter='P .env' \
              --filter='P .env.*' \
              --filter='P */.env' \
              --filter='P */.env.*' \
              ./ "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"; then
              RSYNC_DONE=true
              echo "Rsync completed on attempt ${attempt}."
              break
            fi
            echo "Rsync failed (attempt ${attempt}/3). Retrying in 10s..."
            sleep 10
          done

          if [ "$RSYNC_DONE" != "true" ]; then
            echo "Rsync failed after 3 attempts. Check VPS SSH reachability and disk/network status."
            exit 1
          fi

          # Build and restart on VPS (FORCE_SEED passed as positional arg $1)
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" "bash -s ${FORCE_SEED}" << 'ENDSSH'
            set -euo pipefail
            FORCE_SEED="${1:-false}"
            cd /var/repos/asafarim-digital
            export COMPOSE_PARALLEL_LIMIT=1
            sudo install -m 644 infra/nginx/portal.asafarim.com.conf /etc/nginx/sites-available/portal.asafarim.com.conf
            sudo install -m 644 infra/nginx/content-generator.asafarim.com.conf /etc/nginx/sites-available/content-generator.asafarim.com.conf
            sudo install -m 644 infra/nginx/ops-hub.asafarim.com.conf /etc/nginx/sites-available/ops-hub.asafarim.com.conf
            sudo install -m 644 infra/nginx/marketing-content.asafarim.com.conf /etc/nginx/sites-available/marketing-content.asafarim.com.conf
            sudo install -m 644 infra/nginx/edumatch.asafarim.com.conf /etc/nginx/sites-available/edumatch.asafarim.com.conf
            sudo install -m 644 infra/nginx/vionto.asafarim.com.conf /etc/nginx/sites-available/vionto.asafarim.com.conf
            # Remove old duplicate configs before creating new symlinks
            sudo rm -f /etc/nginx/sites-enabled/portal.asafarim.com
            sudo rm -f /etc/nginx/sites-enabled/content-generator.asafarim.com
            sudo rm -f /etc/nginx/sites-enabled/ops-hub.asafarim.com
            sudo rm -f /etc/nginx/sites-enabled/marketing-content.asafarim.com
            sudo rm -f /etc/nginx/sites-enabled/edumatch.asafarim.com
            sudo rm -f /etc/nginx/sites-enabled/vionto.asafarim.com
            sudo ln -sf /etc/nginx/sites-available/portal.asafarim.com.conf /etc/nginx/sites-enabled/portal.asafarim.com.conf
            sudo ln -sf /etc/nginx/sites-available/content-generator.asafarim.com.conf /etc/nginx/sites-enabled/content-generator.asafarim.com.conf
            sudo ln -sf /etc/nginx/sites-available/ops-hub.asafarim.com.conf /etc/nginx/sites-enabled/ops-hub.asafarim.com.conf
            sudo ln -sf /etc/nginx/sites-available/marketing-content.asafarim.com.conf /etc/nginx/sites-enabled/marketing-content.asafarim.com.conf
            sudo ln -sf /etc/nginx/sites-available/edumatch.asafarim.com.conf /etc/nginx/sites-enabled/edumatch.asafarim.com.conf
            sudo ln -sf /etc/nginx/sites-available/vionto.asafarim.com.conf /etc/nginx/sites-enabled/vionto.asafarim.com.conf
            sudo nginx -t
            sudo systemctl reload nginx
            docker compose up -d postgres redis
            docker compose rm -f db-migrate || true
            echo "Docker disk usage before cleanup:"
            docker system df || true
            # Only prune if disk is >80% full to avoid wiping caches every deploy
            DISK_PCT=$(df -h / | awk 'NR==2 {gsub(/%/,""); print $5}')
            if [ "$DISK_PCT" -gt 80 ] 2>/dev/null || [ -z "$DISK_PCT" ]; then
              echo "Disk usage ${DISK_PCT:-unknown}%, pruning old images/containers..."
              docker image prune -f --filter "until=72h" || true
              docker container prune -f || true
            else
              echo "Disk usage ${DISK_PCT}% — skipping aggressive prune to preserve build cache"
            fi
            echo "Docker disk usage after cleanup:"
            docker system df || true
            # Rebuild images sequentially with BuildKit for layer caching
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            export BUILDKIT_INLINE_CACHE=1
            docker compose build --pull db-migrate
            docker compose build --pull portal
            docker compose build --pull content-generator
            docker compose build --pull ops-hub
            docker compose build --pull marketing-content
            docker compose build --pull edumatch
            docker compose build --pull vionto
            docker compose build --pull vionto-worker
            docker compose up -d db-migrate
            echo "Waiting for db-migrate to complete..."
            timeout 300 sh -c 'until [ "$(docker inspect --format={{.State.Status}} asafarim-db-migrate 2>/dev/null)" = "exited" ]; do sleep 3; done'
            MIGRATE_EXIT=$(docker inspect --format={{.State.ExitCode}} asafarim-db-migrate 2>/dev/null || echo 1)
            if [ "$MIGRATE_EXIT" != "0" ]; then
              echo "db-migrate failed!"
              docker logs asafarim-db-migrate --tail=50
              exit 1
            fi

            echo "Checking whether initial seed is required..."
            SITE_CONTENT_COUNT=$(docker compose run --rm db-migrate sh -lc 'node -e '\''const { PrismaClient } = require("@prisma/client"); const prisma = new PrismaClient(); (async () => { const count = await prisma.siteContent.count(); console.log(count); await prisma.$disconnect(); })().catch(async (error) => { console.error(error); try { await prisma.$disconnect(); } catch {} process.exit(1); });'\''' 2>/tmp/site-content-count.err | tr -d '[:space:]' || true)
            if ! [[ "$SITE_CONTENT_COUNT" =~ ^[0-9]+$ ]]; then
              echo "Could not determine SiteContent count. Skipping seed check."
              if [ -s /tmp/site-content-count.err ]; then
                tail -n 50 /tmp/site-content-count.err
              fi
              SITE_CONTENT_COUNT=1
            fi
            if [ "${SITE_CONTENT_COUNT:-0}" = "0" ] || [ "${FORCE_SEED}" = "true" ]; then
              if [ "${FORCE_SEED}" = "true" ]; then
                echo "FORCE_SEED=true. Re-running seed (upserts will refresh content)..."
              else
                echo "SiteContent is empty. Running initial seed..."
              fi
              docker compose run --rm db-migrate sh -lc "npm run db:seed"
            else
              echo "SiteContent already present (${SITE_CONTENT_COUNT}). Skipping seed. (Use workflow_dispatch with force_seed=true to override.)"
            fi

            docker compose up -d --force-recreate portal content-generator ops-hub marketing-content edumatch vionto vionto-worker
            docker system prune -f
            echo "Deployment complete!"
            docker compose ps
          ENDSSH

      - name: Verify deployment
        run: |
          set -euo pipefail
          SSH_OPTS="-4 -p ${VPS_SSH_PORT} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" << 'ENDVERIFY'
            echo "Waiting for all services to become healthy..."
            RETRIES=18
            for i in $(seq 1 $RETRIES); do
              PORTAL_OK=false
              CG_OK=false
              OPS_OK=false
              MC_OK=false
              EDUMATCH_OK=false
              VIONTO_OK=false
              VIONTO_WORKER_OK=false
              curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && PORTAL_OK=true
              curl -sf http://localhost:3002/api/health > /dev/null 2>&1 && CG_OK=true
              curl -sf http://localhost:3003/api/health > /dev/null 2>&1 && OPS_OK=true
              curl -sf http://localhost:3004/api/health > /dev/null 2>&1 && MC_OK=true
              curl -sf http://localhost:3005/api/health > /dev/null 2>&1 && EDUMATCH_OK=true
              curl -sf http://localhost:3006/api/health > /dev/null 2>&1 && VIONTO_OK=true
              docker inspect -f '{{.State.Running}}' asafarim-vionto-worker 2>/dev/null | grep -q "true" && VIONTO_WORKER_OK=true
              if [ "$PORTAL_OK" = true ] && [ "$CG_OK" = true ] && [ "$OPS_OK" = true ] && [ "$MC_OK" = true ] && [ "$EDUMATCH_OK" = true ] && [ "$VIONTO_OK" = true ] && [ "$VIONTO_WORKER_OK" = true ]; then
                echo "All services healthy after ${i}x5s"
                exit 0
              fi
              echo "Attempt $i/$RETRIES: portal=$PORTAL_OK cg=$CG_OK ops=$OPS_OK mc=$MC_OK edumatch=$EDUMATCH_OK vionto=$VIONTO_OK vionto_worker=$VIONTO_WORKER_OK — waiting 5s..."
              sleep 5
            done
            echo "=== Portal logs ==="
            docker logs asafarim-portal --tail=50
            echo "=== Content-generator logs ==="
            docker logs asafarim-content-generator --tail=50
            echo "=== Ops-hub logs ==="
            docker logs asafarim-ops-hub --tail=50
            echo "=== Marketing-content logs ==="
            docker logs asafarim-marketing-content --tail=50
            echo "=== EduMatch logs ==="
            docker logs asafarim-edumatch --tail=50
            echo "=== Vionto logs ==="
            docker logs asafarim-vionto --tail=50
            echo "=== Vionto worker logs ==="
            docker logs asafarim-vionto-worker --tail=50
            echo "Health check failed after 90s"
            exit 1
          ENDVERIFY
