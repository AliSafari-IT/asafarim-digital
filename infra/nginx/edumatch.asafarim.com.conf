server {
    listen 80;
    server_name edumatch.asafarim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edumatch.asafarim.com;

    # Allow inquiry attachment uploads. App caps files at 50 MB
    # (lib/server/validation.ts); 55m gives headroom for multipart overhead.
    # Without this, nginx's 1 MB default returns 413 on real uploads.
    client_max_body_size 55m;

    ssl_certificate     /etc/letsencrypt/live/edumatch.asafarim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edumatch.asafarim.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
