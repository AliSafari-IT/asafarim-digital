x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # â”€â”€â”€ Database â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: asafarim-postgres
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asafarim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asafarim_secret}
      POSTGRES_DB: ${POSTGRES_DB:-asafarim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asafarim}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # â”€â”€â”€ Database Migrations â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  db-migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    container_name: asafarim-db-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asafarim-net
    restart: "no"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: asafarim-redis
    restart: unless-stopped
    logging: *default-logging
    # No password required for local dev - disable protected mode
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis_data:/data
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # â”€â”€â”€ Portal â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
        NEXT_PUBLIC_CONTENT_GENERATOR_URL: ${NEXT_PUBLIC_CONTENT_GENERATOR_URL:-https://content-generator.asafarim.com}
        NEXT_PUBLIC_MARKETING_CONTENT_URL: ${NEXT_PUBLIC_MARKETING_CONTENT_URL:-https://marketing-content.asafarim.com}
        NEXT_PUBLIC_VIONTO_URL: ${NEXT_PUBLIC_VIONTO_URL:-https://vionto.asafarim.com}
    container_name: asafarim-portal
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORTAL_URL=${PORTAL_URL:-https://portal.asafarim.com}
      - CONTENT_GENERATOR_URL=${CONTENT_GENERATOR_URL:-https://content-generator.asafarim.com}
      - NEXT_PUBLIC_CONTENT_GENERATOR_URL=${NEXT_PUBLIC_CONTENT_GENERATOR_URL:-https://content-generator.asafarim.com}
      - MARKETING_CONTENT_URL=${MARKETING_CONTENT_URL:-https://marketing-content.asafarim.com}
      - NEXT_PUBLIC_MARKETING_CONTENT_URL=${NEXT_PUBLIC_MARKETING_CONTENT_URL:-https://marketing-content.asafarim.com}
      - VIONTO_URL=${VIONTO_URL:-https://vionto.asafarim.com}
      - NEXT_PUBLIC_VIONTO_URL=${NEXT_PUBLIC_VIONTO_URL:-https://vionto.asafarim.com}
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      # Auth
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-https://portal.asafarim.com}
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_DOMAIN=.asafarim.com
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim-net
    volumes:
      - portal_uploads:/app/apps/portal/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s

  # â”€â”€â”€ Content Generator â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  content-generator:
    build:
      context: .
      dockerfile: apps/content-generator/Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
        NEXT_PUBLIC_CONTENT_GENERATOR_URL: ${NEXT_PUBLIC_CONTENT_GENERATOR_URL:-https://content-generator.asafarim.com}
    container_name: asafarim-content-generator
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORTAL_URL=${PORTAL_URL:-https://portal.asafarim.com}
      - NEXT_PUBLIC_PORTAL_URL=${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      # Auth (same DB and secrets â€” shared SSO)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://content-generator.asafarim.com
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_DOMAIN=.asafarim.com
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001"]
      interval: 30s
      timeout: 10s

  # â”€â”€â”€ Ops Hub â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ops-hub:
    build:
      context: .
      dockerfile: apps/ops-hub/Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
    container_name: asafarim-ops-hub
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORTAL_URL=${PORTAL_URL:-https://portal.asafarim.com}
      - NEXT_PUBLIC_PORTAL_URL=${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://ops-hub.asafarim.com
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_DOMAIN=.asafarim.com
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3003/api/health"]
      interval: 30s
      timeout: 10s

  # â”€â”€â”€ Marketing + Content Engine â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  marketing-content:
    build:
      context: .
      dockerfile: apps/marketing-content/Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
    container_name: asafarim-marketing-content
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORTAL_URL=${PORTAL_URL:-https://portal.asafarim.com}
      - NEXT_PUBLIC_PORTAL_URL=${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
      - MARKETING_CONTENT_URL=${MARKETING_CONTENT_URL:-https://marketing-content.asafarim.com}
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://marketing-content.asafarim.com
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_DOMAIN=.asafarim.com
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3004/api/health"]
      interval: 30s
      timeout: 10s

  # â”€â”€â”€ EduMatch â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  edumatch:
    build:
      context: .
      dockerfile: apps/edumatch/Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
        NEXT_PUBLIC_EDUMATCH_URL: ${NEXT_PUBLIC_EDUMATCH_URL:-https://edumatch.asafarim.com}
        NEXT_PUBLIC_CONTENT_GENERATOR_URL: ${NEXT_PUBLIC_CONTENT_GENERATOR_URL:-https://content-generator.asafarim.com}
        NEXT_PUBLIC_MARKETING_CONTENT_URL: ${NEXT_PUBLIC_MARKETING_CONTENT_URL:-https://marketing-content.asafarim.com}
        NEXT_PUBLIC_OPS_HUB_URL: ${NEXT_PUBLIC_OPS_HUB_URL:-https://ops-hub.asafarim.com}
    container_name: asafarim-edumatch
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORTAL_URL=${PORTAL_URL:-https://portal.asafarim.com}
      - NEXT_PUBLIC_PORTAL_URL=${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
      - EDUMATCH_URL=${EDUMATCH_URL:-https://edumatch.asafarim.com}
      - NEXT_PUBLIC_EDUMATCH_URL=${NEXT_PUBLIC_EDUMATCH_URL:-https://edumatch.asafarim.com}
      - NEXT_PUBLIC_CONTENT_GENERATOR_URL=${NEXT_PUBLIC_CONTENT_GENERATOR_URL:-https://content-generator.asafarim.com}
      - NEXT_PUBLIC_MARKETING_CONTENT_URL=${NEXT_PUBLIC_MARKETING_CONTENT_URL:-https://marketing-content.asafarim.com}
      - NEXT_PUBLIC_OPS_HUB_URL=${NEXT_PUBLIC_OPS_HUB_URL:-https://ops-hub.asafarim.com}
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      # Auth (same DB and secrets â€” shared SSO)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://edumatch.asafarim.com
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_DOMAIN=.asafarim.com
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      # DigitalOcean Spaces (S3-compatible object storage)
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION:-fra1}
      # EduMatch uses its own Spaces bucket (separate from vionto's shared
      # ${DO_SPACES_BUCKET}). The access key is account-wide, so KEY/SECRET
      # are shared; only the bucket differs.
      - DO_SPACES_BUCKET=${EDUMATCH_DO_SPACES_BUCKET:-asafarim-edumatch}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      # Redis
      - REDIS_URL=${REDIS_URL}
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_RESEND_FROM_EMAIL=${NEXT_PUBLIC_RESEND_FROM_EMAIL}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3005/api/health"]
      interval: 30s
      timeout: 10s

  # â”€â”€â”€ Vionto â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  vionto:
    build:
      context: .
      dockerfile: apps/vionto/Dockerfile
    container_name: asafarim-vionto
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_VIONTO_URL=${NEXT_PUBLIC_VIONTO_URL:-https://vionto.asafarim.com}
      - NEXT_PUBLIC_PORTAL_URL=${NEXT_PUBLIC_PORTAL_URL:-https://portal.asafarim.com}
      - PORTAL_URL=${PORTAL_URL:-https://portal.asafarim.com}
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      # Auth (shared SSO â€” same secret as portal)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=https://vionto.asafarim.com
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_DOMAIN=.asafarim.com
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION:-fra1}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_PUBLIC_URL=${DO_SPACES_PUBLIC_URL}
      - VIONTO_STORAGE_DRIVER=${VIONTO_STORAGE_DRIVER:-spaces}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3006/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # â”€â”€â”€ Vionto Render Worker â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  vionto-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.vionto-worker
    container_name: asafarim-vionto-worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - WORKER_HEALTH_PORT=3007
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asafarim}:${POSTGRES_PASSWORD:-asafarim_secret}@postgres:5432/${POSTGRES_DB:-asafarim}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION:-fra1}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_PUBLIC_URL=${DO_SPACES_PUBLIC_URL}
      - VIONTO_STORAGE_DRIVER=${VIONTO_STORAGE_DRIVER:-spaces}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - asafarim-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3007"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 4G
volumes:
  postgres_data:
  portal_uploads:
  redis_data:

networks:
  asafarim-net:
    driver: bridge
