packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  # Exclude package-local demos; they manage their own deps and lockfiles.
  - "!packages/navigation/demo"
allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: false
  prisma: false
  puppeteer: true
  sharp: true
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@asafarim/envage@0.1.0'
  - '@asafarim/envage@0.2.0'
