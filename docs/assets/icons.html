<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:32px;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;max-width:960px;}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-panel);}
.tile svg{color:var(--color-text);}
.tile span{font-size:11px;color:var(--color-text-muted);font-family:var(--font-mono);letter-spacing:0.04em;}
h1{font-size:24px;letter-spacing:-0.02em;margin:0 0 24px;}
.eyebrow{margin-bottom:8px;}
</style></head>
<body>
<p class="eyebrow">Icon Registry · Lucide-style</p>
<h1>Stroked, 2px, round caps · 24×24 viewBox</h1>
<div class="grid" id="g"></div>
