<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);min-height:100vh;}
body{background-image:var(--gradient-page-noise);}
.wrap{padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;}
.spec{flex:1;}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);text-align:right;line-height:1.5;}
.h1{font-size:64px;line-height:1.02;letter-spacing:-0.05em;font-weight:600;margin:0;}
.h2{font-size:40px;line-height:1.05;letter-spacing:-0.04em;font-weight:600;margin:0;}
.h3{font-size:24px;line-height:1.2;letter-spacing:-0.03em;font-weight:600;margin:0;}
.grad{background:var(--gradient-headline);-webkit-background-clip:text;background-clip:text;color:transparent;}
</style></head><body>
<div class="wrap">
  <div class="row"><div class="spec"><h1 class="h1">Ship <span class="grad">full-stack SaaS</span>.</h1></div><div class="meta">H1 · 64px<br/>tracking -0.05em<br/>weight 600 · Manrope</div></div>
  <div class="row"><div class="spec"><h2 class="h2">Capabilities, not packages.</h2></div><div class="meta">H2 · 40px<br/>tracking -0.04em<br/>weight 600</div></div>
  <div class="row"><div class="spec"><h3 class="h3">Frontend Systems</h3></div><div class="meta">H3 · 24px<br/>tracking -0.03em<br/>weight 600</div></div>
</div></body></html>
