<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:18px 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{display:flex;flex-direction:column;gap:6px;}
.chip{aspect-ratio:1.6/1;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,0.08);}
.lbl{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);}
.name{color:var(--color-text);font-family:var(--font-sans);font-weight:600;font-size:11.5px;}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:#07111F"></div><div class="lbl"><span class="name">Surface</span><span>#07111F</span></div></div>
  <div class="sw"><div class="chip" style="background:#0D192D"></div><div class="lbl"><span class="name">Surf-soft</span><span>#0D192D</span></div></div>
  <div class="sw"><div class="chip" style="background:#0D0D0F;border-color:rgba(255,255,255,0.18);"></div><div class="lbl"><span class="name">Midnight</span><span>#0D0D0F</span></div></div>
  <div class="sw"><div class="chip" style="background:#14161C"></div><div class="lbl"><span class="name">Elevated</span><span>#14161C</span></div></div>
  <div class="sw"><div class="chip" style="background:#2A2F3B"></div><div class="lbl"><span class="name">Border-dk</span><span>#2A2F3B</span></div></div>
  <div class="sw"><div class="chip" style="background:#A3A9B7"></div><div class="lbl"><span class="name">Slate</span><span>#A3A9B7</span></div></div>
  <div class="sw"><div class="chip" style="background:#9FB0CF"></div><div class="lbl"><span class="name">Text-muted</span><span>#9FB0CF</span></div></div>
  <div class="sw"><div class="chip" style="background:#EFF4FF"></div><div class="lbl"><span class="name">Text</span><span>#EFF4FF</span></div></div>
  <div class="sw"><div class="chip" style="background:#F5F7FB"></div><div class="lbl"><span class="name">Brand-text</span><span>#F5F7FB</span></div></div>
  <div class="sw"><div class="chip" style="background:rgba(129,149,181,0.18);border-color:rgba(129,149,181,0.4);"></div><div class="lbl"><span class="name">Border</span><span>rgba 18%</span></div></div>
</div></body></html>
