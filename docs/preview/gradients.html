<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:18px 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.g{display:flex;flex-direction:column;gap:8px;}
.swatch{aspect-ratio:3.4/1;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,0.08);}
.lbl{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);}
.name{color:var(--color-text);font-family:var(--font-sans);font-weight:600;font-size:12px;}
</style></head><body>
<div class="wrap">
  <div class="g"><div class="swatch" style="background:linear-gradient(135deg,#3A7BFF 0%,#4FF2C9 100%)"></div><div class="lbl"><span class="name">Brand · azure → mint</span><span>135° · 0–100%</span></div></div>
  <div class="g"><div class="swatch" style="background:linear-gradient(120deg,#6AA3FF 0%,#A78BFA 50%,#5DE4C7 100%)"></div><div class="lbl"><span class="name">Headline · azure-violet-mint</span><span>120° · 0–50–100%</span></div></div>
  <div class="g"><div class="swatch" style="background:linear-gradient(135deg,#C084FC,#F472B6)"></div><div class="lbl"><span class="name">Violet spark (AI pillar)</span><span>135°</span></div></div>
  <div class="g"><div class="swatch" style="background:linear-gradient(135deg,#36C6A8,#5DE4C7)"></div><div class="lbl"><span class="name">Mint (backend pillar)</span><span>135°</span></div></div>
</div></body></html>
