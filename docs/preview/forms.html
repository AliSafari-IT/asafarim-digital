<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:22px 28px;display:flex;flex-direction:column;gap:14px;max-width:560px;}
.field{display:flex;flex-direction:column;gap:6px;}
label{font-size:13px;font-weight:500;color:var(--color-text-muted);}
input,textarea,select{width:100%;border-radius:14px;border:1px solid var(--color-border);background:var(--color-surface-soft);color:var(--color-text);padding:12px 16px;font-size:14px;font-family:inherit;outline:none;transition:border-color 180ms;}
input:focus,textarea:focus,select:focus{border-color:#4C7DFF;}
textarea{resize:vertical;min-height:60px;line-height:1.6;}
.help{font-size:12px;color:var(--color-text-muted);}
</style></head><body>
<div class="wrap">
  <div class="field">
    <label>Email</label>
    <input type="email" value="ali@asafarim.com" />
  </div>
  <div class="field">
    <label>Prompt</label>
    <textarea>Write a launch email for a new AI meeting assistant aimed at startup founders.</textarea>
  </div>
</div></body></html>
