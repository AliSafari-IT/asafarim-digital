<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:18px 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{display:flex;flex-direction:column;gap:6px;}
.chip{aspect-ratio:1.6/1;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,0.06);}
.lbl{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);letter-spacing:.02em;}
.name{color:var(--color-text);font-family:var(--font-sans);font-weight:600;font-size:11.5px;}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:#3A7BFF"></div><div class="lbl"><span class="name">Azure</span><span>#3A7BFF</span></div></div>
  <div class="sw"><div class="chip" style="background:#4C7DFF"></div><div class="lbl"><span class="name">Primary</span><span>#4C7DFF</span></div></div>
  <div class="sw"><div class="chip" style="background:#4FF2C9"></div><div class="lbl"><span class="name">Mint</span><span>#4FF2C9</span></div></div>
  <div class="sw"><div class="chip" style="background:#5DE4C7"></div><div class="lbl"><span class="name">Accent</span><span>#5DE4C7</span></div></div>
  <div class="sw"><div class="chip" style="background:linear-gradient(135deg,#3A7BFF,#4FF2C9)"></div><div class="lbl"><span class="name">Brand grad.</span><span>135°</span></div></div>
</div></body></html>
