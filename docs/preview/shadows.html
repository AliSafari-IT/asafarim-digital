<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:36px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px;}
.box{width:120px;height:80px;background:var(--color-panel);border:1px solid var(--color-border);border-radius:var(--radius-lg);}
.lbl{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;}
.name{color:var(--color-text);font-weight:600;font-size:12px;}
.val{color:var(--color-text-muted);font-family:var(--font-mono);font-size:10.5px;}
</style></head><body>
<div class="wrap">
  <div class="cell"><div class="box" style="box-shadow:0 28px 80px -40px rgba(0,0,0,0.72);"></div><div class="lbl"><span class="name">card</span><span class="val">deep cushion</span></div></div>
  <div class="cell"><div class="box" style="box-shadow:0 20px 40px -22px rgba(76,125,255,0.75);"></div><div class="lbl"><span class="name">glow</span><span class="val">azure bloom · CTA</span></div></div>
  <div class="cell"><div class="box" style="box-shadow:0 16px 50px -28px rgba(58,123,255,0.50);"></div><div class="lbl"><span class="name">brand-card</span><span class="val">azure-tinted</span></div></div>
  <div class="cell"><div class="box" style="box-shadow:0 0 0 1px rgba(58,123,255,0.35), 0 12px 36px -20px rgba(79,242,201,0.55);"></div><div class="lbl"><span class="name">brand-glow</span><span class="val">ring + mint</span></div></div>
</div></body></html>
