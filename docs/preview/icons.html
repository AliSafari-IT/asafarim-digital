<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:24px 28px;display:grid;grid-template-columns:repeat(8,1fr);gap:14px;}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-panel);}
.tile svg{width:22px;height:22px;color:var(--color-text);}
.tile span{font-size:10.5px;color:var(--color-text-muted);font-family:var(--font-mono);letter-spacing:.04em;}
</style></head><body>
<div class="wrap" id="g"></div>
<script>
