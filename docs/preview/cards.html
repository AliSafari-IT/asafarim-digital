<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
body{background:radial-gradient(circle at 15% 20%,rgba(76,125,255,0.18),transparent 38%),var(--color-surface);}
.wrap{padding:24px 28px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card{border-radius:24px;border:1px solid var(--color-border);background:rgba(11,23,42,0.78);padding:22px;transition:all 220ms cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.card.hover{transform:translateY(-4px);border-color:var(--color-border-strong);box-shadow:0 28px 80px -40px rgba(0,0,0,0.72);}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.22em;color:var(--color-text-muted);margin:0;}
h3{font-size:20px;letter-spacing:-0.03em;margin:8px 0 6px;font-weight:600;}
p{font-size:13px;line-height:1.6;color:var(--color-text-muted);margin:0;}
.icon{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,#36C6A8,#5DE4C7);color:#0d192d;margin-bottom:8px;}
.badge{position:absolute;top:14px;right:14px;font-size:9.5px;text-transform:uppercase;letter-spacing:0.2em;color:var(--color-text-muted);font-weight:600;}
</style></head><body>
<div class="wrap">
  <div class="card">
    <span class="badge">REST</span>
    <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v6c0 1.38 3.13 2.5 7 2.5s7-1.12 7-2.5v-6"/><path d="M5 11.5v6c0 1.38 3.13 2.5 7 2.5s7-1.12 7-2.5v-6"/></svg></div>
    <h3>At rest</h3>
    <p>Translucent panel · 1px slate border · no shadow.</p>
  </div>
  <div class="card hover">
    <span class="badge">HOVER</span>
    <div class="icon" style="background:linear-gradient(135deg,#4C7DFF,#6AA3FF)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
    <h3>Lifted state</h3>
    <p>Translate-y-1 · border-strong · shadow-card. 220ms · easeOutExpo.</p>
  </div>
</div></body></html>
