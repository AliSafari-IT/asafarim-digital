<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:24px 28px;display:flex;flex-direction:column;gap:10px;max-width:540px;}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px solid transparent;cursor:pointer;color:var(--color-text-muted);font-size:14px;font-weight:500;transition:all 180ms;}
.row svg{width:18px;height:18px;flex-shrink:0;}
.row.active{background:linear-gradient(135deg,rgba(58,123,255,0.18),rgba(79,242,201,0.10));border-color:rgba(58,123,255,0.32);color:var(--color-text);}
.row.hover{background:rgba(255,255,255,0.04);color:var(--color-text);}
.row .meta{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);}
.tag{display:inline-flex;padding:2px 8px;border-radius:9999px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;background:rgba(79,242,201,0.14);color:#5DE4C7;}
</style></head><body>
<div class="wrap">
  <div class="row active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    <span>Overview</span>
    <span class="meta">⌘1</span>
  </div>
  <div class="row hover">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <span>Capabilities</span><span class="tag">3 NEW</span>
  </div>
  <div class="row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span>Case studies</span>
  </div>
  <div class="row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Engagements</span>
  </div>
</div></body></html>
