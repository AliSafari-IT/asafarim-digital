<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);min-height:280px;}
body{background:radial-gradient(circle at 20% 0%,rgba(76,125,255,0.16),transparent 38%),var(--color-surface);}
.wrap{padding:22px 28px;display:flex;flex-direction:column;gap:14px;}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:9999px;background:rgba(13,25,45,0.78);border:1px solid var(--color-border-strong);backdrop-filter:blur(12px);}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-0.02em;font-size:15px;color:var(--color-text);}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3A7BFF,#4FF2C9);display:flex;align-items:center;justify-content:center;color:#0d192d;font-weight:800;font-size:13px;font-family:var(--font-display);}
.links{display:flex;gap:6px;margin-left:18px;}
.links a{color:var(--color-text-muted);font-size:13px;font-weight:500;padding:6px 12px;border-radius:9999px;text-decoration:none;}
.links a.on{color:var(--color-text);background:rgba(255,255,255,0.06);}
.actions{margin-left:auto;display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:600;border:1px solid var(--color-border-strong);background:transparent;color:var(--color-text-muted);cursor:pointer;}
.btn.primary{background:#4C7DFF;color:white;border-color:transparent;}
.crumbs{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:12px;color:var(--color-text-muted);}
.crumbs span.cur{color:var(--color-text);}
.crumbs svg{width:12px;height:12px;opacity:.6;}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <div class="brand"><div class="logo">A</div>ASafariM</div>
    <div class="links">
      <a class="on">Capabilities</a>
      <a>Case studies</a>
      <a>Stack</a>
      <a>Contact</a>
    </div>
    <div class="actions">
      <button class="btn">Sign in</button>
      <button class="btn primary">Start a project</button>
    </div>
  </div>
  <div class="crumbs">
    <span>Portal</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    <span>Capabilities</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    <span class="cur">Frontend Systems</span>
  </div>
</div></body></html>
