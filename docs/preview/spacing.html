<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:24px 28px;display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:14px;}
.bar{height:14px;border-radius:var(--radius-xs);background:linear-gradient(90deg,#3A7BFF,#4FF2C9);}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);min-width:64px;}
.px{font-family:var(--font-mono);font-size:11px;color:var(--color-text);min-width:56px;text-align:right;}
.use{font-size:12px;color:var(--color-text-muted);}
</style></head><body>
<div class="wrap">
  <div class="row"><span class="tag">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span><span class="use">— icon nudge</span></div>
  <div class="row"><span class="tag">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span><span class="use">— inline gap</span></div>
  <div class="row"><span class="tag">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span><span class="use">— button gap</span></div>
  <div class="row"><span class="tag">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span><span class="use">— card padding base</span></div>
  <div class="row"><span class="tag">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span><span class="use">— card padding md</span></div>
  <div class="row"><span class="tag">space-8</span><div class="bar" style="width:32px"></div><span class="px">32px</span><span class="use">— card padding lg</span></div>
  <div class="row"><span class="tag">space-12</span><div class="bar" style="width:48px"></div><span class="px">48px</span><span class="use">— intra-section</span></div>
  <div class="row"><span class="tag">space-24</span><div class="bar" style="width:96px"></div><span class="px">96px</span><span class="use">— section spacing (mt-24)</span></div>
</div></body></html>
