<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-sans);}
.wrap{padding:24px 28px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;}
.code-window{border-radius:var(--radius-2xl);border:1px solid var(--color-border-strong);background:#081120;padding:18px;box-shadow:var(--shadow-card);}
.dots{display:flex;gap:6px;align-items:center;}
.dot{width:9px;height:9px;border-radius:50%;}
.fname{margin-left:10px;font-family:var(--font-mono);font-size:10.5px;color:rgba(186,212,255,0.7);text-transform:uppercase;letter-spacing:.18em;}
pre{margin:14px 0 0;font-family:var(--font-mono);font-size:13px;line-height:1.6;color:#cfe1ff;white-space:pre;}
.tk-k{color:#a78bfa;} .tk-s{color:#5DE4C7;} .tk-n{color:#FFBE5B;} .tk-c{color:#6e7d96;font-style:italic;}
.numerics{display:flex;flex-direction:column;gap:10px;justify-content:center;}
.num{display:flex;align-items:baseline;gap:14px;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-panel);}
.num .v{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--color-text);letter-spacing:-0.01em;}
.num .l{font-size:11px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.18em;font-weight:600;}
</style></head><body>
<div class="wrap">
  <div class="code-window">
    <div class="dots"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="fname">stack.preview.ts</span></div>
<pre><span class="tk-c">// IBM Plex Mono · 13px · leading 1.6</span>
<span class="tk-k">export const</span> stack = {
  frontend: <span class="tk-s">"Next.js · TypeScript"</span>,
  backend:  <span class="tk-s">".NET · PostgreSQL"</span>,
  ai:       <span class="tk-s">"RAG · agents"</span>,
  p95:      <span class="tk-n">247</span>,
};</pre>
  </div>
  <div class="numerics">
    <div class="num"><span class="v">247ms</span><span class="l">p95 latency</span></div>
    <div class="num"><span class="v">99.97%</span><span class="l">uptime</span></div>
    <div class="num"><span class="v">12+</span><span class="l">prod ships</span></div>
  </div>
</div></body></html>
